<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Carnet d'entraînement escalade</title>
<meta name="theme-color" content="#1D2A2E">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Carnet escalade">
<meta name="description" content="Carnet d'entraînement d'escalade : plannings, blocs, séances, exercices et suivi.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E6EAE9;--paper:#FBFCFB;--ink:#1D2A2E;--muted:#5C6B6F;--line:#C8D0CF;--soft:#EEF2F1;
  --esc:#C27F00;--mus:#2C5E9E;--sou:#3B8560;--warn:#B3412E;
  --fh:'Barlow Condensed','Arial Narrow',Arial,sans-serif;
  --fb:'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#141B1D;--paper:#1C2528;--ink:#E4EAE9;--muted:#93A2A5;--line:#34413F;--soft:#232E31;
  --esc:#E5A82E;--mus:#76A2DE;--sou:#6CC093;--warn:#E07560;
}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 var(--fb)}
body{padding-top:env(safe-area-inset-top);padding-bottom:calc(70px + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--fh);font-weight:700;margin:0;line-height:1.1;letter-spacing:.01em}
h1{font-size:2.1rem}h2{font-size:1.45rem}h3{font-size:1.15rem;font-weight:600}
.s-esc{--c:var(--esc)}.s-mus{--c:var(--mus)}.s-sou{--c:var(--sou)}

header.top{display:flex;align-items:center;gap:8px;max-width:1000px;margin:0 auto;padding:10px 14px 0}
header.top .brand{font:700 1.05rem var(--fh);flex:1;display:flex;align-items:center;gap:8px}
.rope{display:inline-flex;gap:2px}.rope i{width:6px;height:18px;border-radius:2px;display:block}
.rope i:nth-child(1){background:var(--esc)}.rope i:nth-child(2){background:var(--mus)}.rope i:nth-child(3){background:var(--sou)}

main{max-width:1000px;margin:0 auto;padding:10px 14px 30px}
.head{margin:8px 0 6px}.lead{color:var(--muted);margin:4px 0 0;max-width:62ch}
.back{background:none;border:0;color:var(--muted);padding:6px 0;cursor:pointer;font-weight:600}

.btn{background:var(--ink);color:var(--paper);border:0;border-radius:6px;padding:9px 14px;font-weight:600;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.sm{padding:5px 10px;font-size:.88rem}
.btn.danger{background:transparent;color:var(--warn);border:1.5px solid currentColor}
.btn.go{background:var(--c,#2C5E9E);color:#fff}
@media (prefers-color-scheme:dark){.btn.go{color:#0F171A}}
.todaybar .btn.go{background:#24508C;color:#fff;font-weight:700}
.todaybar .tbwk{background:#E1EAF7;color:#24508C;border:1.5px solid #24508C;font-weight:700}
.todaybar .tbwk:hover{background:#24508C;color:#fff}
@media (prefers-color-scheme:dark){.todaybar .tbwk{background:rgba(156,192,240,.14);color:#BCD5F5;border-color:#9CC0F0}.todaybar .tbwk:hover{background:#9CC0F0;color:#0F171A}}
@media (prefers-color-scheme:dark){.todaybar .btn.go{background:#9CC0F0;color:#0F171A}}
.ic{background:none;border:0;color:var(--muted);cursor:pointer;padding:4px 7px;border-radius:4px;font-size:1rem}
.ic:hover{background:var(--soft);color:var(--ink)}
:focus-visible{outline:2.5px solid var(--mus);outline-offset:2px}
.row-btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}

.ses{margin-top:22px;border-left:5px solid var(--c);padding-left:12px}
.ses-h{display:flex;align-items:center;justify-content:space-between;gap:8px}
.ses-h h2{color:var(--c)}
.type{margin-top:12px}
.type-h{display:flex;align-items:center;gap:6px}.type-h h3{flex:1}
ul.rows{list-style:none;margin:6px 0;padding:0;background:var(--paper);border:1px solid var(--line);border-radius:6px;overflow:hidden}
ul.rows:empty{display:none}
ul.rows li+li{border-top:1px solid var(--line)}
.row{display:flex;width:100%;align-items:center;justify-content:space-between;gap:10px;background:none;border:0;padding:10px 12px;text-align:left;cursor:pointer}
.row:hover{background:var(--soft)}
.rt{font-weight:600}.rm{color:var(--muted);font-size:.86rem;text-align:right}
.add{background:none;border:1.5px dashed var(--line);border-radius:6px;width:100%;padding:8px;color:var(--muted);cursor:pointer;font-weight:600}
.add:hover{border-color:var(--c,var(--ink));color:var(--ink)}
.empty{color:var(--muted);font-style:italic;margin:8px 0}

.card{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:14px;margin-top:14px}
.card>h2{margin-bottom:8px}
.fields{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.f{display:flex;flex-direction:column;gap:3px;font-size:.84rem;font-weight:600;color:var(--muted)}
.f.wide{grid-column:1/-1}
input,select,textarea{background:var(--bg);border:1.5px solid var(--line);border-radius:5px;padding:7px 9px;font-size:.95rem;width:100%;min-width:0}
textarea{min-height:80px;resize:vertical;line-height:1.4}
input[type=number]{max-width:110px}
.title-in{font:700 1.7rem var(--fh);background:transparent;border:0;border-bottom:2px solid var(--line);border-radius:0;padding:4px 0}

.stats{display:flex;flex-wrap:wrap;gap:8px 22px;margin-top:6px}
.stat b{display:block;font:700 1.5rem var(--fh)}.stat span{color:var(--muted);font-size:.82rem}
.inten{display:inline-flex;gap:3px;vertical-align:middle;margin-right:6px}
.inten i{width:12px;height:12px;border-radius:2px;background:var(--line)}
.inten i.on{background:var(--c,var(--ink))}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{display:inline-flex;align-items:center;gap:4px;background:var(--soft);border:1px solid var(--line);border-radius:20px;padding:2px 4px 2px 10px;font-size:.84rem}
.chip.c{border-color:var(--c);background:color-mix(in srgb,var(--c) 12%,var(--paper));padding-right:10px}
.chip button{background:none;border:0;cursor:pointer;color:var(--muted);padding:0 4px}

.item{border:1px solid var(--line);border-left:4px solid var(--c,var(--ink));border-radius:6px;padding:10px;margin-top:10px;background:var(--bg)}
.item-h{display:flex;align-items:center;gap:8px}
.num{font:700 1.3rem var(--fh);min-width:22px;color:var(--muted)}
.item-h select{flex:1;font-weight:600}
.vars{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:8px 0;font-size:.85rem;color:var(--muted)}
.vars select{width:auto;font-size:.85rem;padding:3px 6px}
.params{display:flex;flex-wrap:wrap;gap:10px 16px}
.params label{display:flex;flex-direction:column;gap:3px;font-size:.8rem;font-weight:600;color:var(--muted)}
.params .pair{display:flex;gap:4px}.params .pair select{width:auto}
.params small{font-weight:500;color:var(--ink)}

.list-cards{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));margin-top:8px}
.lc{background:var(--paper);border:1px solid var(--line);border-top:4px solid var(--c,var(--ink));border-radius:6px;padding:12px;text-align:left;cursor:pointer}
.lc:hover{border-color:var(--ink)}
.lc h3{margin-bottom:4px}.lc p{margin:2px 0;color:var(--muted);font-size:.87rem}

.tw{overflow-x:auto;border:1px solid var(--line);border-radius:6px;background:var(--paper);margin-top:10px}
table.g{border-collapse:collapse;min-width:100%;font-size:.86rem}
table.g th,table.g td{border:1px solid var(--line);padding:5px;vertical-align:top;min-width:104px}
table.g th[scope=row]{position:sticky;left:0;background:var(--soft);text-align:left;min-width:96px;max-width:110px;font:600 .95rem/1.15 var(--fh);z-index:1}
table.g tr.wk td{font:700 1.15rem var(--fh);background:var(--ink);color:var(--paper)}
table.g tr.kind td{font:600 .95rem var(--fh);background:var(--soft);text-align:left}
table.g tr.days td{font-weight:600;text-align:center;color:var(--muted)}
td.cellb{cursor:pointer;height:52px}td.cellb:hover{background:var(--soft)}
td.cellb .plus{color:var(--line);font-size:1.2rem;display:block;text-align:center}
td.off{background:repeating-linear-gradient(45deg,transparent 0 6px,var(--soft) 6px 12px)}
.tag{display:block;width:100%;text-align:left;border:0;border-left:3px solid var(--c);background:color-mix(in srgb,var(--c) 13%,transparent);padding:3px 6px;margin:2px 0;border-radius:3px;font-size:.8rem;line-height:1.25;cursor:pointer;color:var(--ink)}
.tag small{display:block;color:var(--muted);font-size:.74rem}
.tag.todo{border-left-style:dashed}

.bars{display:grid;grid-template-columns:minmax(110px,auto) 1fr auto;gap:5px 10px;align-items:center;font-size:.88rem;margin-top:8px}
.bar{height:10px;border-radius:2px;background:var(--c,var(--ink))}
.warn{color:var(--warn);font-weight:600;font-size:.9rem}
.weeks{list-style:none;padding:0;margin:8px 0 0}
.weeks li{padding:4px 0;border-bottom:1px dotted var(--line);font-size:.92rem}
.weeks b{font-family:var(--fh);font-size:1.05rem;margin-right:6px}
.seq{list-style:none;padding:0;margin:8px 0;counter-reset:s}
.seq li{display:flex;align-items:center;gap:8px;padding:7px 8px;background:var(--bg);border:1px solid var(--line);border-radius:5px;margin-bottom:6px}
.seq li::before{counter-increment:s;content:counter(s);font:700 1.2rem var(--fh);color:var(--muted);min-width:18px}
.seq .sname{flex:1;font-weight:600}.seq small{color:var(--muted);font-weight:500}

.charts{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.chartbox h3{font-size:1.02rem;margin-bottom:4px}
svg.chart{width:100%;height:auto;display:block}
svg.chart text{font:11px var(--fb);fill:var(--muted)}

nav.tabs{position:fixed;bottom:0;left:0;right:0;background:var(--paper);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:20}
nav.tabs button{flex:1;max-width:220px;border:0;background:none;padding:9px 4px 11px;font:600 1.05rem var(--fh);color:var(--muted);border-top:3px solid transparent;cursor:pointer}
nav.tabs button.on{color:var(--ink);border-top-color:var(--ink)}

#sheet{display:none}#sheet.on{display:block}
.scrim{position:fixed;inset:0;background:rgba(10,20,22,.45);z-index:30}
.panel{position:fixed;left:0;right:0;bottom:0;max-height:85vh;overflow:auto;background:var(--paper);border-top:6px solid var(--c);border-radius:12px 12px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));z-index:31;max-width:640px;margin:0 auto}
.entry{border:1px solid var(--line);border-radius:6px;padding:10px;margin-top:10px;display:grid;gap:8px}

.badge{display:inline-block;min-width:18px;text-align:center;border-radius:3px;color:#fff;font-size:.72rem;font-weight:700;margin-right:4px;padding:0 3px}
.b-ok{background:#2E8B57}.b-plus{background:#2C6FBF}.b-moins{background:#D07A12}.b-non{background:#B3412E}.b-mix{background:#6B5BA8}
.tag.st-non{opacity:.6;text-decoration:line-through}
.stbtns{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:6px}
.stbtns button{border:1.5px solid var(--line);background:var(--bg);border-radius:6px;padding:7px 2px;font-size:.8rem;font-weight:600;cursor:pointer;line-height:1.15}
.stbtns button b{display:block;font-size:1.05rem}
.stbtns button.on{color:#fff;border-color:transparent}
.stbtns button.on.v-ok{background:#2E8B57}.stbtns button.on.v-plus{background:#2C6FBF}.stbtns button.on.v-moins{background:#D07A12}.stbtns button.on.v-non{background:#B3412E}
.vex{border:1px solid var(--line);border-radius:6px;padding:9px;margin-top:8px}
.vex .vt{font-weight:600}.vex .vp{color:var(--muted);font-size:.85rem}
.real{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px;font-size:.8rem;font-weight:600;color:var(--muted)}
.real label{display:flex;flex-direction:column;gap:2px}.real input{width:80px}
.fold{background:none;border:0;cursor:pointer;color:var(--muted);font-size:1rem;padding:2px 6px;margin-left:-4px;margin-right:2px;border-radius:4px;vertical-align:middle;line-height:1}
.fold:hover{background:var(--soft);color:var(--ink)}
.fold span{display:inline-block;transition:transform .15s}
.closed .fold span,.closedw .fold span{transform:rotate(-90deg)}
table.g tr.wk .fold{color:var(--paper)}table.g tr.wk .fold:hover{background:rgba(255,255,255,.15);color:var(--paper)}
.card.closed>:not(h2){display:none}
.card.closed{padding-bottom:10px}
.ses.closed>:not(.ses-h){display:none}
table.g.closedw tr:not(.wk){display:none}
.swatch{width:26px;height:26px;padding:0;border:2px solid var(--line);border-radius:50%;overflow:hidden;cursor:pointer;flex:none;background:none}
.swatch::-webkit-color-swatch-wrapper{padding:0}.swatch::-webkit-color-swatch{border:0;border-radius:50%}.swatch::-moz-color-swatch{border:0;border-radius:50%}
.type-h h3{color:var(--c)}
li.ordli{display:flex;align-items:center}li.ordli .row{flex:1}
.ord{display:inline-flex;flex:none}
.lc{position:relative}.lc .ord{position:absolute;top:6px;right:6px}.lc h3{padding-right:96px}
.slider{display:flex;align-items:center;gap:10px;font-size:.85rem;color:var(--muted);font-weight:600;margin-top:4px}
.slider input{flex:1;accent-color:var(--c,var(--ink));padding:0;border:0;background:none}
.adjv{text-align:center;margin:4px 0}.adjv b{font:700 1.6rem var(--fh)}
.chks{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.88rem;color:var(--muted);align-items:center}
label.chk{display:inline-flex;align-items:center;gap:5px;color:var(--ink);font-weight:500}label.chk input{width:auto}
.flow{border:1px solid var(--line);border-radius:6px;overflow:hidden}
.fr{font:700 1.05rem var(--fh);background:var(--soft);padding:5px 10px;border-top:1px solid var(--line)}.fr:first-child{border-top:0}
.fw{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;padding:7px 10px;border-left:4px solid var(--c,var(--ink));border-top:1px solid var(--line);background:var(--paper)}
.fw b{flex:1;min-width:120px}.fw span{color:var(--muted);font-size:.84rem}.fw em{font-style:normal;font-weight:600}
.fp{display:flex;align-items:center;gap:6px;padding:4px 10px 4px 22px;border-top:1px dashed var(--line);font-size:.88rem;color:var(--muted)}
.fp span{flex:1}.fp input{width:72px;padding:3px 6px}
.fp.ov{background:color-mix(in srgb,#D07A12 14%,transparent);color:var(--ink);font-weight:600}
.gal{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
.gal figure{margin:0}
.thumb{display:block;width:100%;aspect-ratio:4/3;padding:0;border:1px solid var(--line);border-radius:6px;overflow:hidden;cursor:zoom-in;background:var(--soft)}
.thumb img,.cov,.mini,.runimg{object-fit:cover;display:block}
.thumb img{width:100%;height:100%}
.cap{margin-top:4px;font-size:.82rem;padding:4px 6px}
.phb{display:flex;justify-content:space-between;align-items:center}
.covl{font-size:.75rem;color:var(--muted);font-weight:600}
.upl{display:inline-block;margin-top:10px;cursor:pointer}
img.missing{visibility:hidden}
.lc .cov{width:calc(100% + 24px);height:130px;margin:-12px -12px 10px;max-width:none}
.lc .ord{background:var(--paper);border-radius:6px;z-index:1}
.mini{width:40px;height:40px;border-radius:5px;flex:none}
.row .rt{flex:1}
.runimg{max-width:min(100%,420px);max-height:30vh;object-fit:contain;margin:10px auto;border-radius:8px}
.rlist .mini{width:36px;height:36px}
#lb{display:none;position:fixed;inset:0;z-index:60;background:rgba(8,12,14,.94);align-items:center;justify-content:center;padding:calc(50px + env(safe-area-inset-top)) 10px calc(20px + env(safe-area-inset-bottom))}
#lb.on{display:flex}
#lb figure{margin:0;text-align:center;max-width:100%}
#lb img{max-width:100%;max-height:78vh;border-radius:6px}
#lb figcaption{color:#e8eeee;margin-top:8px}#lb figcaption span{opacity:.6;font-size:.85rem;margin-left:6px}
.lbx,.lbn{position:absolute;background:rgba(255,255,255,.15);color:#fff;border:0;border-radius:6px;cursor:pointer;font-size:1.4rem;line-height:1;padding:8px 14px}
.lbx{top:calc(10px + env(safe-area-inset-top));right:10px}
.lbn{top:50%;transform:translateY(-50%);font-size:2rem}.lbn.l{left:8px}.lbn.r{right:8px}
.libbar{display:flex;gap:8px;align-items:center;margin-bottom:10px}.libbar input{flex:1}.libbar .upl{margin:0;white-space:nowrap}
.chipb{border:1.5px solid var(--line);background:var(--bg);border-radius:20px;padding:3px 11px;font-size:.84rem;cursor:pointer;font-weight:600}
.chipb.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.panel.lg{max-height:92vh;border-top-color:var(--ink)}
.row-btns.sticky{position:sticky;bottom:-16px;background:var(--paper);padding:10px 0 4px;margin-top:6px}
.gal.pick{grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.pk{position:relative;padding:0;border:2px solid var(--line);border-radius:6px;overflow:hidden;background:var(--soft);cursor:pointer;text-align:left;color:var(--ink)}
.pk img{width:100%;aspect-ratio:1;object-fit:cover;display:block}
.pk span{display:block;font-size:.78rem;padding:3px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pk.on{border-color:var(--mus);box-shadow:0 0 0 2px var(--mus)}
.pk i{position:absolute;top:5px;right:5px;background:var(--mus);color:#fff;border-radius:50%;width:24px;height:24px;display:grid;place-items:center;font-style:normal;font-weight:700}
.pk.got{opacity:.5;cursor:default}.pk em{position:absolute;top:5px;left:5px;background:rgba(0,0,0,.6);color:#fff;font-size:.7rem;font-style:normal;padding:1px 5px;border-radius:3px}
nav.tabs button{font-size:1rem}
#dlg{display:none;position:fixed;inset:0;z-index:90;background:rgba(10,20,22,.5);align-items:center;justify-content:center;padding:16px}
#dlg.on{display:flex}
.dbox{background:var(--paper);border-radius:10px;padding:18px;max-width:420px;width:100%;box-shadow:0 10px 40px rgba(0,0,0,.3)}
.dbox p{margin:0 0 10px;white-space:pre-line}.dbox .row-btns{justify-content:flex-end}
.todaybar{max-width:1000px;margin:6px auto 0;padding:0 14px;display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:.88rem;color:var(--muted);font-weight:600}
.todaybar{flex-wrap:wrap}.todaybar>span#tday{flex:1 1 220px}
.tdctl{display:flex;gap:6px;align-items:center;flex:1 1 260px;justify-content:flex-end}
.tdctl select{flex:1;min-width:0;max-width:300px;padding:6px 8px;font-size:.88rem}
.todaybar .btn{white-space:nowrap}
.todaybar{display:block}#tday{margin-bottom:4px}
.tbrow{display:flex;align-items:center;gap:8px;padding:3px 0}
.tbl{flex:0 0 132px;font-weight:700;color:var(--ink)}.tbb{flex:0 0 132px}
.tbc{flex:1;display:flex;gap:6px;min-width:0}.tbc select{flex:1;min-width:0;padding:5px 8px;font-size:.86rem}
.tbprev{flex:1;min-width:0;text-align:left;background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:5px 8px;font-size:.82rem;color:var(--muted);cursor:pointer;display:flex;flex-wrap:wrap;gap:4px;align-items:center;line-height:1.3}
.tbprev b{color:var(--ink)}
.tbchip{display:inline-flex;align-items:center;gap:3px;border-left:3px solid var(--c);background:color-mix(in srgb,var(--c) 13%,transparent);color:var(--ink);padding:1px 6px;border-radius:3px;font-weight:600}
@media (max-width:520px){.tbl,.tbb{flex-basis:104px}.tbb{font-size:.76rem;padding:6px 6px;white-space:normal}}.todaybar span::first-letter{text-transform:uppercase}
.tdate{margin:0 0 6px}
.startrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:10px;padding-top:8px;border-top:1px dotted var(--line);font-size:.86rem;font-weight:600;color:var(--muted)}
.startrow input{width:auto;flex:0 1 180px}
.sub{border-top:1px solid var(--line);margin-top:14px;padding-top:12px}.sub>h3{margin-bottom:6px}

<script>
const KEY='carnet-escalade-v1';

/* ---------- Données d'exemple ---------- */

    E('e9','tm3','Relevés de jambes suspendu','Suspendu à la barre, monter les pieds jusqu\'à la barre.',12,0),
    Object.assign(E('e10','ts1','Grand écart facial','Position tenue, respiration lente.',0,0),{mode:'hold',rmTime:60}),

  const I=(ex,o)=>Object.assign({id:uid(),ex,vars:[],sets:3,rMode:'reps',reps:5,rPct:50,lMode:'pdc',kg:0,lPct:50,work:20,rest:10},o);

  ];
  const fx=id=>({type:fiches.find(f=>f.id===id).type,fiche:id});
  const D=(esc,mus,sou)=>({esc,mus,sou});

let db;
function load(){try{const r=localStorage.getItem(KEY);if(r){const d=JSON.parse(r);if(d&&d.exercises)return d}}catch(e){}return seed()}
let saveWarned=false;
function saveRaw(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){}}

let FIRST_RUN=false;try{FIRST_RUN=!localStorage.getItem(KEY)}catch(e){}
db=load();
function migrate(){db.lib=db.lib||[];const have=new Set(db.lib.map(x=>x.id));

/* ---------- Graphique ---------- */
function chart(pts,unit,col){
  if(!pts.length)return '<p class="empty">Pas encore de données.</p>';
  const W=320,H=150,P={l:36,r:12,t:12,b:24};
  const ts=pts.map(p=>new Date(p.d+'T12:00').getTime());let t0=Math.min(...ts),t1=Math.max(...ts);if(t1===t0){t0-=3*864e5;t1+=3*864e5}
  const vmax=Math.max(...pts.map(p=>p.v))*1.15||1;
  const x=t=>P.l+(t-t0)/(t1-t0)*(W-P.l-P.r),y=v=>H-P.b-v/vmax*(H-P.t-P.b);
  const path=pts.map((p,i)=>(i?'L':'M')+x(ts[i]).toFixed(1)+' '+y(p.v).toFixed(1)).join(' ');
  const dd=t=>{const d=new Date(t);return d.getDate()+'/'+(d.getMonth()+1)};
  const grid=[0,.5,1].map(k=>{const v=vmax*k;return `<line x1="${P.l}" x2="${W-P.r}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${P.l-5}" y="${y(v)+4}" text-anchor="end">${Math.round(v)}</text>`}).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Évolution en ${unit}">${grid}
  <text x="${P.l}" y="${H-6}">${dd(t0)}</text><text x="${W-P.r}" y="${H-6}" text-anchor="end">${dd(t1)}</text>
  <path d="${path}" fill="none" stroke="${col}" stroke-width="2.5" stroke-linejoin="round"/>
  ${pts.map((p,i)=>`<circle cx="${x(ts[i])}" cy="${y(p.v)}" r="3.5" fill="${col}"><title>${p.d} : ${p.v} ${unit}</title></circle>`).join('')}</svg>`;
}

    for(let i=0;i<7;i++){const d=new Date(d0);d.setDate(d0.getDate()+i);B.push({lab:d.toLocaleDateString('fr-FR',{weekday:'short'}).replace('.','')+' '+d.getDate(),from:iso(d),to:iso(d)})}
    const d6=new Date(d0);d6.setDate(d0.getDate()+6);title=`Semaine du ${d0.getDate()} ${MOIS[d0.getMonth()]} au ${d6.getDate()} ${MOIS[d6.getMonth()]} ${d6.getFullYear()}`}
  else if(mode==='month'){const y=t.getFullYear(),m=t.getMonth()+off,f=new Date(y,m,1,12),l=new Date(y,m+1,0,12);let d=new Date(f);
    while(d<=l){const a=new Date(d),e=new Date(d);e.setDate(e.getDate()+(6-((d.getDay()+6)%7)));if(e>l)e.setTime(l.getTime());
      B.push({lab:a.getDate()+'–'+e.getDate(),from:iso(a),to:iso(e)});d=new Date(e);d.setDate(d.getDate()+1)}
    title=f.toLocaleDateString('fr-FR',{month:'long',year:'numeric'})}
  else{const y=t.getFullYear()+off;const M3=['jan','fév','mar','avr','mai','jun','jul','aoû','sep','oct','nov','déc'];for(let k=0;k<12;k++)B.push({lab:M3[k],from:iso(new Date(y,k,1,12)),to:iso(new Date(y,k+1,0,12))});title=String(y)}
  return {title,B}}
function periodChart(key,cfg){const pv=ui.pv=ui.pv||{},wv=pv[key]=pv[key]||{mode:'month',off:0},{title,B}=periodBuckets(wv.mode,wv.off);
  const S=cfg.series.map(se=>Object.assign({},se,{vals:B.map(b=>{const v=se.data.filter(x=>x.d>=b.from&&x.d<=b.to).map(x=>+x.v||0);return v.length?(se.agg==='sum'?v.reduce((a,c)=>a+c,0):se.agg==='avg'?v.reduce((a,c)=>a+c,0)/v.length:Math.max(...v)):null})}));
  const L=S.filter(x=>!x.right).flatMap(x=>x.vals).filter(v=>v!=null),R=S.filter(x=>x.right).flatMap(x=>x.vals).filter(v=>v!=null),hasR=S.some(x=>x.right);
  const W=360,H=230,P={l:38,r:hasR?38:14,t:24,b:30},n=B.length;
  const nice=(v,n)=>{const r=v/n,m=Math.pow(10,Math.floor(Math.log10(r)));const st=[1,2,2.5,5,10].map(k=>k*m).find(k=>k>=r);return st*n};
  const vmax=nice(Math.max(cfg.minL||10,...L)*1.05,4),kmin0=Math.min(0,...R),kmin=kmin0<0?-nice(-kmin0*1.05,2):0,kmax=nice(Math.max(10,...R)*1.05-kmin,2)+kmin;
  const x=i=>P.l+(n===1?.5:i/(n-1))*(W-P.l-P.r),y=v=>H-P.b-v/vmax*(H-P.t-P.b),yk=v=>H-P.b-(v-kmin)/(kmax-kmin)*(H-P.t-P.b);
  const draw=se=>{const yf=se.right?yk:y,pts=se.vals.map((v,i)=>({v,i})).filter(o=>o.v!=null);
    return (pts.length>1?`<path d="${pts.map((o,j)=>(j?'L':'M')+x(o.i).toFixed(1)+' '+yf(o.v).toFixed(1)).join(' ')}" fill="none" stroke="${se.color}" stroke-width="2.5" ${se.dash?'stroke-dasharray="6 4"':''} stroke-linejoin="round"/>`:'')
     +pts.map(o=>{const X=x(o.i),Y=yf(o.v),t=`<title>${B[o.i].lab} : ${h(se.name)} ${Math.round(o.v*10)/10}</title>`;return se.sq?`<rect x="${X-4}" y="${Y-4}" width="8" height="8" fill="${se.color}">${t}</rect>`:`<circle cx="${X}" cy="${Y}" r="4" fill="${se.color}">${t}</circle>`}).join('')};
  const grid=[0,.25,.5,.75,1].map(k=>`<line x1="${P.l}" x2="${W-P.r}" y1="${y(vmax*k)}" y2="${y(vmax*k)}" stroke="var(--line)"/><text x="${P.l-5}" y="${y(vmax*k)+4}" text-anchor="end">${Math.round(vmax*k)}</text>`).join('')
    +(hasR?[0,.5,1].map(k=>{const v=kmin+(kmax-kmin)*k;return `<text x="${W-P.r+5}" y="${yk(v)+4}">${Math.round(v)}</text>`}).join(''):'');
  const xl=B.map((b,i)=>`<line x1="${x(i)}" x2="${x(i)}" y1="${P.t}" y2="${H-P.b}" stroke="var(--line)" stroke-dasharray="2 4"/><text x="${x(i)}" y="${H-10}" text-anchor="middle" class="xl">${b.lab}</text>`).join('');
  const seg=(k,nm)=>`<button class="${wv.mode===k?'on':''}" onclick="A.pv('${key}','mode','${k}')">${nm}</button>`,empty=!L.length&&!R.length;
  return `<div class="wvbar"><div class="seg">${seg('week','Semaine')}${seg('month','Mois')}${seg('year','Année')}</div>
   <div class="wnav"><button class="ic" onclick="A.pv('${key}','off',-1)" aria-label="Période précédente">‹</button><span>${h(title)}</span><button class="ic" onclick="A.pv('${key}','off',1)" aria-label="Période suivante">›</button>${wv.off?`<button class="lnk" onclick="A.pv('${key}','reset')">aujourd'hui</button>`:''}</div></div>
  <div class="legend">${S.map(se=>`<span><i class="${se.sq?'sq':''}" style="background:${se.color}${se.dash?';opacity:.85':''}"></i>${h(se.name)}${se.right&&hasR?' (échelle de droite)':''}</span>`).join('')}</div>
  <svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${h(cfg.label||'Graphique')} : ${h(title)}">${grid}${xl}
   <text x="4" y="12">${cfg.unitL||''}</text>${hasR?`<text x="${W-4}" y="12" text-anchor="end">${cfg.unitR||''}</text>`:''}
   ${S.map(draw).join('')}
   ${empty?`<text x="${(P.l+W-P.r)/2}" y="${(P.t+H-P.b)/2}" text-anchor="middle" class="empt">${cfg.empty||'Aucune donnée sur cette période'}</text>`:''}</svg>`}
function chart3(days,hold,col){const wv=ui.wv=ui.wv||{mode:'month',off:0},{title,B}=periodBuckets(wv.mode,wv.off);
  B.forEach(b=>{const ds=days.filter(d=>d.d>=b.from&&d.d<=b.to);b.has=ds.length>0;b.total=ds.reduce((a,d)=>a+d.total,0);b.max=ds.length?Math.max(...ds.map(d=>d.max)):0;b.load=ds.length?Math.max(...ds.map(d=>d.load)):0});
  const W=360,H=230,P={l:38,r:38,t:24,b:30},n=B.length;
  const vmax=Math.max(10,...B.map(b=>Math.max(b.total,b.max)))*1.15,kmax=Math.max(10,...B.map(b=>b.load))*1.15,kmin=Math.min(0,...B.map(b=>b.load))*1.15;
  const x=i=>P.l+(n===1?.5:i/(n-1))*(W-P.l-P.r),y=v=>H-P.b-v/vmax*(H-P.t-P.b),yk=v=>H-P.b-(v-kmin)/(kmax-kmin)*(H-P.t-P.b);
  const u=hold?'s':'rép.',pts=B.map((b,i)=>({b,i})).filter(o=>o.b.has);
  const line=(get,yf,c,dash)=>pts.length>1?`<path d="${pts.map((o,j)=>(j?'L':'M')+x(o.i).toFixed(1)+' '+yf(get(o.b)).toFixed(1)).join(' ')}" fill="none" stroke="${c}" stroke-width="2.5" ${dash?'stroke-dasharray="6 4"':''} stroke-linejoin="round"/>`:'';
  const dots=(get,yf,c,lab,un,sq)=>pts.map(o=>{const X=x(o.i),Y=yf(get(o.b));return sq?`<rect x="${X-4}" y="${Y-4}" width="8" height="8" fill="${c}"><title>${o.b.lab} : ${lab} ${get(o.b)} ${un}</title></rect>`:`<circle cx="${X}" cy="${Y}" r="4" fill="${c}"><title>${o.b.lab} : ${lab} ${get(o.b)} ${un}</title></circle>`}).join('');
  const grid=[0,.25,.5,.75,1].map(k=>`<line x1="${P.l}" x2="${W-P.r}" y1="${y(vmax*k)}" y2="${y(vmax*k)}" stroke="var(--line)"/><text x="${P.l-5}" y="${y(vmax*k)+4}" text-anchor="end">${Math.round(vmax*k)}</text>`).join('')
    +[0,.5,1].map(k=>{const v=kmin+(kmax-kmin)*k;return `<text x="${W-P.r+5}" y="${yk(v)+4}">${Math.round(v)}</text>`}).join('');
  const xl=B.map((b,i)=>`<line x1="${x(i)}" x2="${x(i)}" y1="${P.t}" y2="${H-P.b}" stroke="var(--line)" stroke-dasharray="2 4"/><text x="${x(i)}" y="${H-10}" text-anchor="middle" class="xl">${b.lab}</text>`).join('');
  const seg=(k,n)=>`<button class="${wv.mode===k?'on':''}" onclick="A.wView('mode','${k}')">${n}</button>`;
  return `<div class="wvbar"><div class="seg">${seg('week','Semaine')}${seg('month','Mois')}${seg('year','Année')}</div>
   <div class="wnav"><button class="ic" onclick="A.wView('off',-1)" aria-label="Période précédente">‹</button><span>${h(title)}</span><button class="ic" onclick="A.wView('off',1)" aria-label="Période suivante">›</button>${wv.off?`<button class="lnk" onclick="A.wView('reset')">aujourd'hui</button>`:''}</div></div>
  <div class="legend"><span><i style="background:${col}"></i>${hold?'Temps total tenu (s)':'Répétitions au total'}</span><span><i style="background:${COL3.max}"></i>${hold?'Plus long maintien (s)':'Max sur une série'}</span><span><i class="sq" style="background:${COL3.load}"></i>Lest max (kg, échelle de droite)</span></div>
  <svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Suivi du travail : ${h(title)}">${grid}${xl}
   <text x="4" y="12">${u}</text><text x="${W-4}" y="12" text-anchor="end">kg</text>
   ${line(b=>b.total,y,col)}${line(b=>b.max,y,COL3.max,1)}${line(b=>b.load,yk,COL3.load)}
   ${dots(b=>b.total,y,col,'total',u)}${dots(b=>b.max,y,COL3.max,'max série',u)}${dots(b=>b.load,yk,COL3.load,'lest max','kg',1)}
   ${pts.length?'':`<text x="${(P.l+W-P.r)/2}" y="${(P.t+H-P.b)/2}" text-anchor="middle" class="empt">Aucun travail sur cette période</text>`}</svg>`}

function est1RM(e){if(e.mode==='hold')return null;const bw=+(db.settings||{}).bw||0;if(!bw)return {need:true};
  const B=bw,ep=(w,r)=>r>1?w*(1+r/30):w,out=[],L=+e.rmLoad||0;
  if(+e.rmReps)out.push({from:`tes ${e.rmReps} répétitions au poids de corps`,v:ep(B,+e.rmReps)-B,r:+e.rmReps});
  if(L){const r=+e.rmLoadReps||1;out.push({from:`ton record ${L>0?'avec +'+L+' kg de lest':'allégé de '+(-L)+' kg'} sur ${r} répétition${r>1?'s':''}`,v:ep(B+L,r)-B,r})}
  if(!out.length)return {none:true};const rel=out.filter(x=>x.r<=12),pool=rel.length?rel:out,best=pool.reduce((a,b)=>b.v>a.v?b:a);return {list:out,best,B}}
function maxCard(e,extra,work){const hold=e.mode==='hold',id=e.id,ES=est1RM(e),on=rmOn(e);
  const r05=v=>Math.round(v*2)/2;
  let est='';
  if(!hold){if(ES.need)est='';
    else if(!ES.none){const v=r05(ES.best.v);
      const B=ES.B,T=B+ES.best.v,pct=Math.round(T/B*100),rth=T>B?Math.round(30*(T/B-1)):0;
      est=`<div class="estl">
       <div class="est ha"><b>${v>=0?'≈ +'+v+' kg':'≈ '+v+' kg'}</b><span>${v>=0?'lest maximum théorique sur 1 répétition':'allègement nécessaire pour 1 répétition (élastique, poulie…)'}</span></div>
<p class="lead hint">${ES.list.map(x=>`D'après ${x.from} : ≈ ${r05(x.v)} kg.`).join(' ')} Estimation par la formule d'Epley avec ton poids de corps (${B} kg). Elle est plus fiable quand le record tient en moins de 12 répétitions.</p>
       <div class="est"><b>≈ ${pct} %</b><span>du poids de corps soulevé théoriquement sur 1 répétition (${Math.round(T)} kg pour ${B} kg)</span></div>
       <div class="est"><b>${+e.rmReps?e.rmReps:'≈ '+rth} rép.</b><span>RM de répétitions au poids de corps${+e.rmReps?(rth&&Math.abs(rth-e.rmReps)>1?' (mesuré ; théorique ≈ '+rth+')':' (mesuré)'):' (théorique)'}</span></div></div>
`}}
  const typeSel=`<label class="f wide">Type d'exécution<select onchange="A.set('exercises','${id}','mode',this.value,0,1)">
     <option value="reps" ${!hold?'selected':''}>Dynamique : répétitions du mouvement (ex. traction)</option><option value="hold" ${hold?'selected':''}>Statique : tenir une position (ex. gainage, suspension)</option></select></label>`;
  const head=`<div class="fields">${typeSel}</div><label class="chk rmchk"><input type="checkbox" ${on?'checked':''} onchange="A.rmOn('${id}',this.checked)">Travail du RM</label>`;
  if(!on)return `<div class="card"><h2>Expérience sur cet exercice</h2>
   <div class="sub"><h3>Mon maximum (RM)</h3>${head}
   <p class="lead" style="margin-top:4px">Coche « Travail du RM » pour suivre ton maximum sur cet exercice : saisie du RM, estimations, courbe de progression et séances en % du max.</p></div>
   ${work||''}</div>`;
  return `<div class="card"><h2>Expérience sur cet exercice</h2>
   <div class="sub"><h3>Mon maximum (RM)</h3><p class="lead hint">Chaque nouvelle valeur est datée et ajoutée à ta courbe de progression. Les séances en % du max se mettent à jour toutes seules.</p>${head}<div class="fields" style="margin-top:8px">
   ${hold?`<label class="f">Temps max tenu au poids de corps (s)<input type="number" min="0" value="${+e.rmTime||0}" onchange="A.setRM('${id}','rmTime',this.value)"></label>`
     :`<label class="f">Répétitions max au poids de corps<input type="number" min="0" value="${+e.rmReps||0}" onchange="A.setRM('${id}','rmReps',this.value)"></label>`}
   <div class="f lestpair"><span class="lpl">Lest max</span><div class="lp">
     <label><input type="number" step="0.5" value="${+e.rmLoad||0}" aria-label="Lest maximal en kg" onchange="A.setRM('${id}','rmLoad',this.value)"><span>kg</span></label>
     ${hold?`<label><span>tenu</span><input type="number" min="1" value="${+e.rmLoadTime||0}" aria-label="Temps tenu avec ce lest" onchange="A.setRM('${id}','rmLoadTime',this.value)"><span>s</span></label>`
       :`<label><span>sur</span><input type="number" min="1" value="${+e.rmLoadReps||1}" aria-label="Nombre de répétitions avec ce lest" onchange="A.setRM('${id}','rmLoadReps',this.value)"><span>rép.</span></label>`}</div>
     <small style="font-weight:500">${hold?'lest tenu pendant ce temps':'lest réalisé sur ce nombre de répétitions'} · négatif = allègement</small></div>
   ${hold?`<label class="f">Propreté de la position (%)<input type="number" min="0" max="100" value="${e.rmForm!=null?+e.rmForm:100}" onchange="A.setRM('${id}','rmForm',this.value)"><small style="font-weight:500">100 % = forme parfaite</small></label>`:''}
  </div>
  ${est}</div>
  ${extra||''}
  ${work||''}</div>`}

    <button class="add" style="margin-top:8px" onclick="A.newFiche('${t.id}')">+ Nouvelle séance</button><button class="add dirnew" onclick="A.dirNew('fiches|${t.id}')">+ Nouveau dossier</button></div>`}).join('')||'<p class="empty">Aucun type. Ajoute-en un pour créer des séances.</p>'}
  </section>`).join('')+`<button class="add" style="margin-top:20px" onclick="A.addCat()">+ Ajouter une catégorie</button>`;

function itemRow(f,it,i){
  const e=exOf(it.ex),s=e?typeSes(e.type):'mus',fid=f.id,iid=it.id;
  const call=(field,num,rr=1)=>`A.fi('${fid}','${iid}','${field}',this.value,${num},${rr})`;

function flowCard(f,top){normG(f);const tab=f.timer==='tabata',rd=Math.max(1,+f.rounds||1),G=f.groups;let html='',total=0,nov=0;
  const range=g=>{const a=f.items.findIndex(it=>it.g===g.id);if(a>=0)return [a,a+f.items.filter(it=>it.g===g.id).length];
    const k=G.indexOf(g);let p=0;for(let i=0;i<k;i++)p+=f.items.filter(it=>it.g===G[i].id).length;return [p,p]};
  const grpRestEdit=(g,k,auto)=>k<G.length-1?`<div class="fp gr"><span>${tab?'Repos':'Temps de repos conseillé'} entre les ensembles${tab&&rd>1?' (tous les tours)':''}</span>
     ${restChip('gr|'+f.id+'|'+g.id,g.restAfter==null||g.restAfter===''?(auto!=null?auto:''):+g.restAfter,`A.grpSet('${f.id}','${g.id}','restAfter',this.value)`,g.restAfter==null||g.restAfter==='')}</div>`:'';
  const gIns=k=>`<button class="ins gins" onclick="A.grpAdd('${f.id}',${k})">+ Ajouter un ensemble ici</button>`;
  if(tab){const steps=buildSteps(f);total=steps.reduce((a,x)=>a+x.dur,0);nov=steps.filter(x=>x.ov).length;
    for(let r=1;r<=rd;r++){const R1=r===1;
      if(rd>1)html+=`<div class="fr">Tour ${r}</div>`;
      G.forEach((g,k)=>{const [a,b]=range(g),fo=gFolded(f,g);
        html+=grpHead(f,g,k,b-a);
        if(!fo){html+='<div class="gbody">';
          for(let idx=a;idx<b;idx++){const it=f.items[idx],S=steps.filter(x=>x.r===r&&x.it===it);html+=insPoint(f,idx,g.id,'',r);
            S.forEach((x,j)=>{if(x.k==='work')html+=flowRow(f,it,idx,`${x.n>1?'série '+x.set+'/'+x.n+', ':''}${qtyTxt(it)}, ${loadTxt(it)}`,x.dur+' s',x.set===1,r);
              else if(!(idx===b-1&&j===S.length-1))html+=restRow(f,x,j===S.length-1&&f.items[idx+1]?`Repos entre « ${h(exName(it))} » et « ${h(exName(f.items[idx+1]))} »`:`Repos entre les séries de « ${h(exName(it))} »`)})}
          html+=insPoint(f,b,g.id,b>a?'+ Ajouter un exercice dans cet ensemble':'+ Ajouter le premier exercice de cet ensemble',r);
          html+='</div>'}
        const gx=steps.find(x=>x.r===r&&x.grp===g.id);
        if(R1)html+=grpRestEdit(g,k,gx?gx.base:null);else if(gx)html+=restRow(f,gx,'Repos entre les ensembles');
        html+=gIns(k+1)});
      const bt=steps.find(x=>x.r===r&&x.between);if(bt)html+=restRow(f,bt,'Repos entre les tours')}}
  else{html+=rd>1?`<div class="fr">Circuit répété ${rd} fois</div>`:'';
    G.forEach((g,k)=>{const [a,b]=range(g),fo=gFolded(f,g);html+=grpHead(f,g,k,b-a);
      if(!fo){html+='<div class="gbody">';for(let idx=a;idx<b;idx++){const it=f.items[idx];html+=insPoint(f,idx,g.id)+flowRow(f,it,idx,`${+it.sets||1} série${+it.sets>1?'s':''} : ${qtyTxt(it)}, ${loadTxt(it)}`,'',true);
        if(idx<b-1)html+=`<div class="fp"><span>Temps de repos conseillé entre « ${h(exName(it))} » et « ${h(exName(f.items[idx+1]))} »</span>${restChip('it|'+f.id+'|'+it.id,restOf(it),`A.fi('${f.id}','${it.id}','rest',this.value,1,1)`,it.rest==null||it.rest==='')}</div>`}
      html+=insPoint(f,b,g.id,b>a?'+ Ajouter un exercice dans cet ensemble':'+ Ajouter le premier exercice de cet ensemble')+'</div>'}
      html+=grpRestEdit(g,k,b>a?restOf(f.items[b-1]):null)+gIns(k+1)})}

  return `<div class="card"><h2>Structure de la séance</h2>${top||''}
   <div class="sub" ${top?'':'style="border-top:0;margin-top:0;padding-top:0"'}><h3>Paramètres</h3>${paramsBlock(f,ui.loc)}</div>
   <div class="sub"><h3>Exercices dans l'ordre</h3>
   ${f.items.some(it=>it.chk)?`<div class="modban">Certaines valeurs de cette séance (répétitions, temps, charges) sont des estimations : vérifie-les et ajuste-les. Modifier un exercice retire sa mention « à vérifier ». <button class="btn ghost sm" onclick="A.chkAll('${f.id}')">✓ Tout est vérifié</button></div>`:''}
   <p class="lead hint">Les exercices sont rangés en ensembles, que tu peux nommer, déplacer, dupliquer, replier ou supprimer. Touche un exercice pour régler sa charge, ${tab?'son temps de travail et son repos':'son nombre de séries et de répétitions'}. Les boutons + insèrent un exercice à cet endroit. Chaque repos se modifie à la main${tab?' ; ↺ lui redonne sa valeur automatique':''}.</p>
   ${tab&&f.items.length?`<p class="lead" style="margin-top:0">Durée totale : <b>${fmt(total)}</b> (plus 10 s de préparation).</p>`:''}
   ${nov?`<div class="row-btns" style="margin:0 0 8px"><button class="btn ghost sm" onclick="A.restReset('${f.id}')">Remettre tous les repos automatiques (${nov} modifié${nov>1?'s':''})</button></div>`:''}
   <div class="flow">${html}</div>
</div></div>`}

function fstatsBase(f){const a=f.adj;f.adj=null;const r=fstats(f);f.adj=a;return r}

    return {name:exName(it),q:[q0+un,q1+un,q0!==q1],l:[it.lMode==='pdc'?'PdC':'+'+l0+' kg',it.lMode==='pdc'?'PdC':'+'+l1+' kg',l0!==l1],r:[r0+' s',r1+' s',r0!==r1]}})}

     <span>Plus dur</span><button class="btn ghost sm" onclick="A.adj('${fid}','pct',${Math.min(150,pct+5)})" aria-label="Plus 5 %">+5</button></div>

function blocRows(b){const keys=SES.map(s=>s.k);let r=(b.rows||[]).filter(k=>keys.includes(k));
  const used=keys.filter(k=>{for(let i=0;i<b.days;i++)if(((b.cells[i]||{})[k]||[]).length)return true;return false});
  if(!b.rows)r=used.length?keys.filter(k=>used.includes(k)):[];used.forEach(k=>{if(!r.includes(k))r.push(k)});b.rows=r;return r}

function timeline(p){const d=[];p.seq.forEach((bid,k)=>{const b=(p.bcopy&&p.bcopy[bid])||byId('blocs',bid);if(!b)return;for(let i=0;i<b.days;i++)d.push({b,i,k})});return d}
function dayLabel(p,idx){if(p.start)return new Date(dayDate(p,idx)+'T12:00').toLocaleDateString('fr-FR',{weekday:'short',day:'numeric',month:'numeric'});return 'J'+(idx%7+1)}
function planStats(p){const n=timeline(p).length,byT={},byE={};
  for(let day=0;day<n;day++)SES.forEach(s=>planEntries(p,day,s.k).forEach(en=>{byT[en.type]=(byT[en.type]||0)+1;const f=ficheFor(p,en);if(f)f.items.forEach(it=>{if(exOf(it.ex))byE[it.ex]=(byE[it.ex]||0)+1})}));
  return {byT,byE}}
function weekRecap(p){const tl=timeline(p);return [...Array(planWeeks(p)).keys()].map(w=>{const sl=tl.slice(w*7,w*7+7);const seen=[];sl.forEach(d=>{if(!seen.find(x=>x.k===d.k))seen.push(d)});
  return `<li><b>Semaine ${w+1}</b>${seen.length?seen.map(d=>h(d.b.name)+(d.b.kind?' ('+h(d.b.kind)+')':'')).join(', puis '):'<span class="empty">rien de planifié</span>'}</li>`}).join('')}

      <div class="rbtns"><button onclick="A.roundRun()">+1 tour</button><button class="alt" onclick="A.pauseRun()">${R.paused?'Reprendre':'Pause'}</button><button class="alt" onclick="A.endRun()">Terminer</button></div>`;
    if(R.mode==='fortime')body=`<div class="phase">${rounds} tour${rounds>1?'s':''} le plus vite possible${+f.cap?' (limite '+f.cap+' min)':''}</div><div class="big" id="rt">${fmt(R.elapsed)}</div><div class="rounds">${R.rounds} / ${rounds}</div>${list}
      <div class="rbtns"><button onclick="A.roundRun()">+1 tour</button><button class="alt" onclick="A.pauseRun()">${R.paused?'Reprendre':'Pause'}</button><button class="alt" onclick="A.endRun()">Terminer</button></div>`;
    if(R.mode==='none')body=`<div class="phase">${rounds>1?rounds+' tours, ':''}coche les séries faites</div><div class="big" id="rt" style="font-size:3.5rem">${fmt(R.elapsed)}</div>${list}
      <div class="rbtns"><button onclick="A.endRun()">Terminer la séance</button></div>`;
  }
  el.className='on s-'+s+' ph-'+ph;el.style.setProperty('--c',typeColor(f.type));el.innerHTML=head+body;hydrate(el);

function dragApply(src,dst,after){const a=src.split('|'),b=dst.split('|');
  if(b[0]==='dir'){const o=byId(a[0],a[1]);if(o){if(b[2])o.folder=b[2];else delete o.folder;save();render()}return}
  if(a[0]==='fav'){const T=db.settings.tracked,from=T.indexOf(a[1]);T.splice(from,1);const j=T.indexOf(b[1]);T.splice(j+(after?1:0),0,a[1]);save();render();return}
  if(a[0]==='seq'){const P=byId('plannings',a[1]),S=P.seq,from=+a[2];let to=+b[2]+(after?1:0);if(from<to)to--;if(from===to)return;const [x]=S.splice(from,1);S.splice(to,0,x);save();render();return}
  if(a[0]==='cal')return calMove(byId('plannings',a[1]),+a[2],a[3],a[4],+b[2],b.length>4?b[4]:null,after);
  const mv=(arr,o,t)=>{if(!o||!t||o===t)return;arr.splice(arr.indexOf(o),1);arr.splice(arr.indexOf(t)+(after?1:0),0,o)};
  if(a[0]==='item'){const f=fic(a[1]);if(!f)return;mv(f.items,f.items.find(x=>x.id===a[2]),f.items.find(x=>x.id===b[2]));normG(f)}
  else if(a[0]==='group'){const f=fic(a[1]);if(!f)return;mv(f.groups,f.groups.find(x=>x.id===a[2]),f.groups.find(x=>x.id===b[2]));normG(f)}
  else{const o=byId(a[0],a[1]),t=byId(a[0],b[1]);mv(db[a[0]],o,t);if(o&&t&&['fiches','blocs','plannings','exercises'].includes(a[0])&&!o.parent){if(t.folder)o.folder=t.folder;else delete o.folder}}
  save();render()}
